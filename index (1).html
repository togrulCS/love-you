<script>
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const phrases=["I love you","Seni seviyorum","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю","사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ","Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"];
const rand=(a,b)=>a+Math.random()*(b-a);
let W=800,H=800,items=[],start=performance.now(),dpr=1;
function heartPoint(t){return [16*Math.sin(t)**3,13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)]}
function resize(){
 const size=Math.min(innerWidth,innerHeight-58,800);
 dpr=Math.min(devicePixelRatio||1,2);W=H=size;
 canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr);
 canvas.style.width=size+'px';canvas.style.height=size+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);build();
}
function build(){
 const scale=W/800*21, ox=W/2, oy=H/2+20*scale/21;
 const boundary=Array.from({length:720},(_,i)=>{let p=heartPoint(2*Math.PI*i/720);return [ox+p[0]*scale,oy-p[1]*scale]});
 const edges=boundary.map((p,i)=>[p,boundary[(i+1)%720]]);
 const ys=boundary.map(p=>p[1]), minY=Math.min(...ys),maxY=Math.max(...ys);
 function spans(y){
  let xs=[];for(const [[x1,y1],[x2,y2]] of edges){
   if((y1<=y&&y<y2)||(y2<=y&&y<y1))xs.push(x1+(y-y1)*(x2-x1)/(y2-y1));
  }
  xs.sort((a,b)=>a-b);let out=[];for(let i=0;i<xs.length;i+=2)if(xs[i+1]!=null)out.push([xs[i],xs[i+1]]);
  return out;
 }
 items=[];let phraseIndex=0,rowH=17*W/800;
 for(let y=minY+rowH/2;y<maxY-rowH/2;y+=rowH){
  let top=spans(y-rowH/2),bottom=spans(y+rowH/2);
  for(const a of top)for(const b of bottom){
   let left=Math.max(a[0],b[0])+4*W/800,right=Math.min(a[1],b[1])-4*W/800;
   if(right-left<25)continue;
   let x=left+rand(0,8)*W/800;
   while(x<right-18){
    let phrase=phrases[phraseIndex++%phrases.length],fs=rand(9,12)*W/800;
    ctx.font=`bold ${fs}px Arial`;
    let width=ctx.measureText(phrase).width;
    if(x+width>right)break;
    items.push({x,y,phrase,fs,width,delay:rand(0,2.5),seed:Math.random()*10});
    x+=width+7*W/800;
   }
  }
 }
}
function frame(now){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#060208';ctx.fillRect(0,0,W,H);
 let elapsed=(now-start)/1000;
 for(const it of items){
  let p=Math.min(1,Math.max(0,(elapsed-it.delay)/1.05));
  let eased=1-Math.pow(1-p,3), rise=(1-eased)*34*W/800;
  let shimmer=.78+.22*Math.sin(now/500+it.seed);
  let grad=Math.max(0,Math.min(1,(it.y/H)));
  let r= Math.round(115+115*(1-grad)),g=Math.round(4+20*(1-grad)),b=Math.round(24+48*(1-grad));
  ctx.save();ctx.globalAlpha=p*shimmer;ctx.font=`bold ${it.fs}px Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#ff173f';ctx.shadowBlur=5*W/800;
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  ctx.fillText(it.phrase,it.x,it.y+rise);ctx.restore();
 }
 requestAnimationFrame(frame);
}
function init(){resize();start=performance.now();requestAnimationFrame(frame)}
addEventListener('resize',resize);init();
const audio=document.getElementById('music'),btn=document.getElementById('play');
btn.addEventListener('click',async()=>{try{await audio.play();btn.textContent='PLAYING ♥';}catch(e){btn.textContent='TAP AGAIN ♡';}});
</script></body></html>
